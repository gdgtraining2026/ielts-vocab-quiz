<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Interactive Vocabulary Quiz (v2) - Batch 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#2563eb', secondary: '#10b981', alert: '#ef4444' }
                }
            }
        }
    </script>
    <style>
        body { font-family: system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
        .font-serif-en { font-family: 'Georgia', 'Merriweather', serif; }
        .font-mono-kk { font-family: 'Courier New', monospace; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
        .speaker-btn { cursor: pointer; transition: transform 0.1s; }
        .speaker-btn:hover { transform: scale(1.2); }
        .speaker-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div id="app" class="flex flex-col md:flex-row h-screen overflow-hidden">
        
        <!-- 左側側邊欄 -->
        <aside class="w-full md:w-72 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 transition-all z-20">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-blue-50 dark:bg-gray-800">
                <h1 class="text-xl font-bold text-primary dark:text-blue-400">IELTS Vocab Pro</h1>
                <button onclick="toggleMobileMenu()" class="md:hidden text-gray-500 text-2xl">☰</button>
            </div>
            <div id="sidebar-menu" class="hidden md:flex flex-col overflow-y-auto flex-1 p-4 space-y-4">
                
                <!-- 控制面板 -->
                <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-lg border border-gray-200 dark:border-gray-600 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-medium text-gray-600 dark:text-gray-300">Accent:</span>
                        <select id="setting-accent" onchange="updateSettings()" class="bg-white border border-gray-300 text-gray-900 rounded p-1 dark:bg-gray-600 dark:border-gray-500 dark:text-white outline-none">
                            <option value="en-US">🇺🇸 US</option>
                            <option value="en-GB">🇬🇧 GB</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-medium text-gray-600 dark:text-gray-300">Speed:</span>
                        <select id="setting-speed" onchange="updateSettings()" class="bg-white border border-gray-300 text-gray-900 rounded p-1 dark:bg-gray-600 dark:border-gray-500 dark:text-white outline-none">
                            <option value="0.7">🐢 0.7x</option>
                            <option value="0.9" selected>🚶 0.9x</option>
                            <option value="1.0">🏃 1.0x</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="font-medium text-gray-600 dark:text-gray-300">Theme:</span>
                        <button onclick="toggleDarkMode()" class="text-lg px-2 hover:bg-gray-200 dark:hover:bg-gray-600 rounded">🌓</button>
                    </div>
                </div>

                <hr class="border-gray-200 dark:border-gray-700">

                <!-- 導覽按鈕 -->
                <div>
                    <button onclick="switchMode('ALL')" id="btn-mode-all" class="w-full text-left font-bold p-3 rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 transition-colors">
                        📚 All Questions
                    </button>
                </div>
                <div>
                    <button onclick="switchMode('MISTAKES')" id="btn-mode-mistakes" class="w-full text-left font-bold p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors">
                        ❌ My Mistakes (<span id="mistake-count">0</span>)
                    </button>
                </div>

                <hr class="border-gray-200 dark:border-gray-700 mt-auto">

                <!-- 進度條 -->
                <div class="pt-2">
                    <div class="flex justify-between text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1">
                        <span>Progress: <span id="progress-text">0/25</span></span>
                        <span>Accuracy: <span id="accuracy-text">0%</span></span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 dark:bg-gray-700">
                        <div id="progress-bar-fill" class="bg-primary h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右側主內容區 -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-gray-50 dark:bg-gray-900">
            
            <!-- 考題與解析捲動區 -->
            <div id="quiz-scroll-area" class="flex-1 overflow-y-auto p-4 md:p-8 pb-32">
                <div class="max-w-4xl mx-auto space-y-6">
                    
                    <!-- 題目卡片 (純英文) -->
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 md:p-8">
                        <div class="flex justify-between items-start mb-6">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="font-bold text-lg text-gray-800 dark:text-gray-100" id="header-title">Question 1</span>
                                <span id="badge-type" class="text-xs font-bold bg-blue-100 text-blue-800 px-2 py-1 rounded dark:bg-blue-900/50 dark:text-blue-300 border border-blue-200 dark:border-blue-800">MC</span>
                                <span id="badge-category" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded dark:bg-gray-700 dark:text-gray-400 border border-gray-200 dark:border-gray-600">Category</span>
                            </div>
                        </div>

                        <div class="flex gap-4 items-start">
                            <h2 id="q-en" class="text-2xl md:text-3xl font-serif-en text-gray-900 dark:text-white leading-relaxed">
                                <!-- Question text injected here -->
                            </h2>
                            <span onclick="speakCurrentQuestion()" class="speaker-btn text-3xl mt-1" title="Listen to question">🔊</span>
                        </div>

                        <!-- 選項區 -->
                        <div id="options-container" class="mt-8 space-y-3">
                            <!-- Options injected here -->
                        </div>
                        
                        <!-- 提交按鈕 -->
                        <div class="mt-8 flex justify-end">
                            <button id="btn-submit" onclick="submitAnswer()" class="w-full md:w-auto bg-primary hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all disabled:opacity-50 text-lg">
                                Submit Answer
                            </button>
                        </div>
                    </div>

                    <!-- 解析區 (全選項詳解) -->
                    <div id="explanation-card" class="hidden bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                        
                        <!-- 結果 Banner -->
                        <div id="result-banner" class="p-6 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
                            <div id="result-text" class="text-2xl font-bold"></div>
                            <button id="btn-star" onclick="toggleMistakeStar()" class="text-2xl hover:scale-110 transition-transform p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700" title="Toggle Mistake Book">⭐</button>
                        </div>

                        <!-- 全選項詳解列表 -->
                        <div class="p-6 space-y-6">
                            <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                                <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">Analysis</span> 
                                全選項詳解
                            </h3>
                            <div id="options-analysis-container" class="space-y-4">
                                <!-- JS 動態生成所有選項的解析 -->
                            </div>

                            <!-- 額外學習區 -->
                            <div id="extra-learning-section" class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 space-y-4 hidden">
                                <!-- JS 動態生成 IELTS Tip 等 -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 底部導覽列 -->
            <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 flex justify-center gap-4 absolute bottom-0 w-full z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button onclick="prevQuestion()" class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition-colors font-medium">Prev</button>
                <button onclick="nextQuestion()" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition-colors shadow font-medium">Next Question</button>
            </footer>

        </main>
    </div>

    <script>
        // ================= 核心資料庫 (Batch 1: 1-25) =================
        const questionsData = [
    {
        id: 1,
        type: "MC",
        category: "Addition, equation & conclusion",
        source_page: 1,
        difficulty: "medium",
        question_en: "Tourism brings much-needed foreign currency to developing countries. ______, it provides employment for the local population.",
        options: [
            {
                label: "A", text: "Furthermore",
                kk: "[ˋfɝðɚˏmor]", ipa: "/ˌfɜːðəˈmɔː/", part_of_speech: "adv.", meaning_zh: "此外；而且",
                is_correct: true,
                fit_explanation_zh: "✅ 正確答案。furthermore 用於補充說明，與前句的「帶來外匯」形成正面的遞進關係（提供就業）。",
                phrase_example: { en: "The house is beautiful, and furthermore, it's in a great location.", zh: "這間房子很美，此外，它的地段也很好。" },
                collocations: ["and furthermore"]
            },
            {
                label: "B", text: "Similarly",
                kk: "[ˋsɪməlɚlɪ]", ipa: "/ˈsɪmələli/", part_of_speech: "adv.", meaning_zh: "同樣地；相似地",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。similarly 用於比較兩個相似的情況，而此題是增加新的好處，而非比較。",
                phrase_example: { en: "Cars must stop at red lights. Similarly, bicycles must also stop.", zh: "汽車遇到紅燈必須停下。同樣地，自行車也必須停下。" },
                collocations: ["similarly situated"]
            },
            {
                label: "C", text: "Therefore",
                kk: "[ˋðɛrˏfor]", ipa: "/ˈðeəfɔː/", part_of_speech: "adv.", meaning_zh: "因此；所以",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。therefore 用於表達因果關係（因為A所以B）。提供就業並不是帶來外匯的「結果」。",
                phrase_example: { en: "He was injured and therefore unable to play.", zh: "他受傷了，因此無法上場比賽。" },
                collocations: ["and therefore"]
            },
            {
                label: "D", text: "Nevertheless",
                kk: "[ˏnɛvɚðəˋlɛs]", ipa: "/ˌnevəðəˈles/", part_of_speech: "adv.", meaning_zh: "然而；儘管如此",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。nevertheless 用於轉折（讓步），但題目的兩句話都是正面的優點，無轉折關係。",
                phrase_example: { en: "What you said was true. It was, nevertheless, a little unkind.", zh: "你說的是事實。但儘管如此，還是有點不友善。" },
                collocations: ["but nevertheless"]
            }
        ],
        ielts_tip_zh: "💡 IELTS 應用：在 Writing Task 2 擴展論點時，使用 'furthermore' 或 'moreover' 來疊加你的支持理由，能展現出色的邏輯連貫性 (Coherence and Cohesion)。"
    },
    {
        id: 2,
        type: "MC",
        category: "Around the world",
        source_page: 2,
        difficulty: "easy",
        question_en: "Due to rapid economic growth, countries such as Japan, South Korea, and Taiwan in ______ have become major players in global trade.",
        options: [
            {
                label: "A", text: "the Middle East",
                kk: "[ðə ˋmɪd! ist]", ipa: "/ðə ˌmɪdl ˈiːst/", part_of_speech: "n.", meaning_zh: "中東",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。中東通常指阿拉伯半島、伊朗等區域，不包含日韓台。",
                phrase_example: { en: "Oil exports are vital to the economy of the Middle East.", zh: "石油出口對中東經濟至關重要。" },
                collocations: ["Middle East peace process"]
            },
            {
                label: "B", text: "Australasia",
                kk: "[ˏɔstrəˋleʒə]", ipa: "/ˌɒstrəˈleɪʒə/", part_of_speech: "n.", meaning_zh: "大洋洲（尤指紐澳）",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。Australasia 主要涵蓋澳洲、紐西蘭及鄰近太平洋島嶼。",
                phrase_example: { en: "She is studying the indigenous cultures of Australasia.", zh: "她正在研究大洋洲的原住民文化。" },
                collocations: ["Australasia region"]
            },
            {
                label: "C", text: "the Far East",
                kk: "[ðə fɑr ist]", ipa: "/ðə fɑːr iːst/", part_of_speech: "n.", meaning_zh: "遠東（東亞地區）",
                is_correct: true,
                fit_explanation_zh: "✅ 正確答案。在英語地理名詞中，the Far East（遠東）泛指東亞及東南亞國家。",
                phrase_example: { en: "The company has expanded its operations into the Far East.", zh: "該公司已將業務擴展至遠東地區。" },
                collocations: ["markets in the Far East"]
            },
            {
                label: "D", text: "Scandinavia",
                kk: "[ˏskændɪˋnevɪə]", ipa: "/ˌskændɪˈneɪviə/", part_of_speech: "n.", meaning_zh: "斯堪地那維亞半島（北歐）",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。斯堪地那維亞指的是挪威、瑞典、丹麥等北歐國家。",
                phrase_example: { en: "Scandinavia is known for its high standard of living.", zh: "斯堪地那維亞以其高生活水準而聞名。" },
                collocations: ["travel to Scandinavia"]
            }
        ],
        ielts_tip_zh: "💡 IELTS 應用：Listening 測驗中常考地理名詞，注意各個區域 (regions) 所涵蓋的代表性國家。"
    },
    {
        id: 3,
        type: "MC",
        category: "Changes 1",
        source_page: 3,
        difficulty: "medium",
        question_en: "According to the graph, the number of tourists tends to ______ wildly depending on the season and weather conditions.",
        options: [
            {
                label: "A", text: "remain constant",
                kk: "[rɪˋmen ˋkɑnstənt]", ipa: "/rɪˈmeɪn ˈkɒnstənt/", part_of_speech: "phr.v.", meaning_zh: "保持穩定不變",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。remain constant 表示數據持平，與題目中「wildly (劇烈地) 受到季節影響」的語境矛盾。",
                phrase_example: { en: "The temperature in the room remained constant.", zh: "房間裡的溫度保持恆定。" },
                collocations: ["remain relatively constant"]
            },
            {
                label: "B", text: "peak",
                kk: "[pik]", ipa: "/piːk/", part_of_speech: "v.", meaning_zh: "達到頂峰",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。peak 指達到最高點，不能搭配 wildly (劇烈地) 來形容上下的變動。",
                phrase_example: { en: "Traffic peaks between 8 and 9 in the morning.", zh: "交通流量在早上 8 點到 9 點之間達到高峰。" },
                collocations: ["peak at (a number)"]
            },
            {
                label: "C", text: "decline",
                kk: "[dɪˋklaɪn]", ipa: "/dɪˈklaɪn/", part_of_speech: "v.", meaning_zh: "下降；衰退",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。decline 是單向的下降，無法形容受季節影響而產生的「上下波動」。",
                phrase_example: { en: "Profits declined by 10% this year.", zh: "今年的利潤下降了 10%。" },
                collocations: ["decline sharply", "steady decline"]
            },
            {
                label: "D", text: "fluctuate",
                kk: "[ˋflʌktʃʊˏet]", ipa: "/ˈflʌktʃueɪt/", part_of_speech: "v.", meaning_zh: "波動；起伏不定",
                is_correct: true,
                fit_explanation_zh: "✅ 正確答案。fluctuate 專門用來描述數據、價格或數量的上下劇烈變動。",
                phrase_example: { en: "Vegetable prices fluctuate according to the season.", zh: "蔬菜價格隨季節波動。" },
                collocations: ["fluctuate wildly", "fluctuate between"]
            }
        ],
        ielts_tip_zh: "💡 IELTS 應用：Writing Task 1 描寫折線圖 (Line Graph) 必備神字！當線條像波浪一樣時，寫 'fluctuate wildly' 絕對能拿高分。"
    },
    {
        id: 4,
        type: "FILL_MC",
        category: "Changes 2",
        source_page: 5,
        difficulty: "medium",
        question_en: "The environmental conditions in the lake have begun to ______ rapidly due to the discharge of toxic industrial waste.",
        options: [
            {
                label: "A", text: "renovate",
                kk: "[ˋrɛnəˏvet]", ipa: "/ˈrenəveɪt/", part_of_speech: "v.", meaning_zh: "重新粉刷；翻新",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。renovate 通常用於「翻修」老舊的建築物或房間，不能用來形容環境或健康狀態。",
                phrase_example: { en: "They plan to renovate the old farmhouse.", zh: "他們計畫翻修那座老農舍。" },
                collocations: ["renovate a house"]
            },
            {
                label: "B", text: "adapt",
                kk: "[əˋdæpt]", ipa: "/əˈdæpt/", part_of_speech: "v.", meaning_zh: "適應；改編",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。adapt 指為了新情況而調整自己，工業廢水造成的是破壞，而非讓湖泊主動去適應。",
                phrase_example: { en: "It took him a while to adapt to the new climate.", zh: "他花了一段時間才適應新的氣候。" },
                collocations: ["adapt to changes"]
            },
            {
                label: "C", text: "fade",
                kk: "[fed]", ipa: "/feɪd/", part_of_speech: "v.", meaning_zh: "褪色；逐漸消失",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。fade 通常用來指光線變暗、顏色變淡或記憶逐漸消失，不用於形容整體環境的毀壞。",
                phrase_example: { en: "Hopes of a peace settlement are fading.", zh: "達成和平協議的希望正在逐漸破滅。" },
                collocations: ["fade away", "fade slowly"]
            },
            {
                label: "D", text: "deteriorate",
                kk: "[dɪˋtɪrɪəˏret]", ipa: "/dɪˈtɪəriəreɪt/", part_of_speech: "v.", meaning_zh: "惡化；變壞",
                is_correct: true,
                fit_explanation_zh: "✅ 正確答案。deteriorate 是雅思高階字彙，專門形容情況、環境、天氣或健康狀況「變得更糟」。",
                phrase_example: { en: "Her health deteriorated rapidly, and she died shortly afterwards.", zh: "她的健康狀況迅速惡化，不久便過世了。" },
                collocations: ["deteriorate rapidly", "conditions deteriorate"]
            }
        ],
        ielts_tip_zh: "💡 IELTS 應用：在探討環境污染 (Pollution) 或健康問題的論述中，用 deteriorate 替代 get worse 可顯著提升詞彙分數 (Lexical Resource)。"
    },
    {
        id: 5,
        type: "MC",
        category: "Condition",
        source_page: 7,
        difficulty: "hard",
        question_en: "You are welcome to borrow any of the reference books from the library, ______ you return them by the end of the week.",
        options: [
            {
                label: "A", text: "unless",
                kk: "[ʌnˋlɛs]", ipa: "/ʌnˈles/", part_of_speech: "conj.", meaning_zh: "除非",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。unless 表達負面條件（如果不），帶入句子會變成「除非你週末前歸還，否則歡迎借書」，邏輯完全錯誤。",
                phrase_example: { en: "You can't get a job unless you have experience.", zh: "除非你有經驗，否則找不到工作。" },
                collocations: ["unless otherwise stated"]
            },
            {
                label: "B", text: "however many",
                kk: "[haʊˋɛvɚ ˋmɛnɪ]", ipa: "/haʊˈevə ˈmeni/", part_of_speech: "phr.", meaning_zh: "無論多少",
                is_correct: false,
                fit_explanation_zh: "❌ 不適合。however many 後面通常接複數名詞（如 however many times），且不符合此處的「條件」語境。",
                phrase_example: { en: "However many times I try, I still can't do it.", zh: "無論我嘗試多少次，我還是做不到。" },
                collocations: []
            },
            {
                label: "C", text: "providing that",

        // ================= 應用程式狀態管理 =================
        let settings = {
            accent: 'en-US',
            rate: 0.9,
            dark: false
        };

        let state = {
            mode: 'ALL',
            currentIndex: 0,
            answers: {}, // { qId: { isCorrect: boolean, selectedLabel: 'A' } }
            mistakes: new Set(),
            selectedOptionLabel: null,
            submitted: false
        };

        let activeQuestions = questionsData;

        // ================= 初始化 =================
        document.addEventListener('DOMContentLoaded', () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                settings.dark = true;
                document.documentElement.classList.add('dark');
            }
            renderSidebar();
            renderQuestion();
        });

        // ================= Web Speech API =================
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = settings.accent;
            utterance.rate = settings.rate;
            
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => v.lang === settings.accent && 
                (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Aria') || v.name.includes('Samantha'))
            );
            if (preferred) utterance.voice = preferred;
            
            window.speechSynthesis.speak(utterance);
        }

        // 確保語音載入
        window.speechSynthesis.onvoiceschanged = () => {};

        function speakCurrentQuestion() {
            const q = activeQuestions[state.currentIndex];
            let textToSpeak = q.question_en.replace(/_+/g, " blank ");
            speak(textToSpeak);
        }

        // ================= UI 更新與邏輯 =================
        function updateSettings() {
            settings.accent = document.getElementById('setting-accent').value;
            settings.rate = parseFloat(document.getElementById('setting-speed').value);
        }

        function toggleDarkMode() {
            settings.dark = !settings.dark;
            if (settings.dark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function toggleMobileMenu() {
            document.getElementById('sidebar-menu').classList.toggle('hidden');
        }

        function switchMode(mode) {
            state.mode = mode;
            if (mode === 'MISTAKES') {
                activeQuestions = questionsData.filter(q => state.mistakes.has(q.id));
                if (activeQuestions.length === 0) {
                    alert('目前沒有錯題！繼續保持！');
                    switchMode('ALL');
                    return;
                }
            } else {
                activeQuestions = questionsData;
            }
            state.currentIndex = 0;
            renderSidebar();
            renderQuestion();
        }

        function renderSidebar() {
            const btnAll = document.getElementById('btn-mode-all');
            const btnMistakes = document.getElementById('btn-mode-mistakes');
            
            if (state.mode === 'ALL') {
                btnAll.className = "w-full text-left font-bold p-3 rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 transition-colors";
                btnMistakes.className = "w-full text-left font-bold p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors";
            } else {
                btnAll.className = "w-full text-left font-bold p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors";
                btnMistakes.className = "w-full text-left font-bold p-3 rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 transition-colors";
            }

            document.getElementById('mistake-count').innerText = state.mistakes.size;

            let answeredCount = 0;
            let correctCount = 0;
            activeQuestions.forEach(q => {
                if (state.answers[q.id]) {
                    answeredCount++;
                    if (state.answers[q.id].isCorrect) correctCount++;
                }
            });

            const total = activeQuestions.length;
            const accuracy = answeredCount === 0 ? 0 : Math.round((correctCount / answeredCount) * 100);
            const progressPercent = total === 0 ? 0 : (answeredCount / total) * 100;

            document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `${answeredCount}/${total}`;
            document.getElementById('accuracy-text').innerText = `${accuracy}%`;
        }

        function renderQuestion() {
            if (activeQuestions.length === 0) return;

            const q = activeQuestions[state.currentIndex];
            state.selectedOptionLabel = null;
            state.submitted = !!state.answers[q.id];

            document.getElementById('header-title').innerText = `Question ${q.id}`;
            document.getElementById('badge-type').innerText = q.type;
            document.getElementById('badge-category').innerText = q.category;

            // 純英文題目
            document.getElementById('q-en').innerHTML = formatQuestionEn(q.question_en);

            // 渲染選項
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                
                // 狀態樣式邏輯
                let stateClasses = "bg-white border-gray-200 dark:bg-gray-800 dark:border-gray-700 hover:border-blue-400 dark:hover:border-blue-500 cursor-pointer";
                
                if (state.submitted) {
                    const ans = state.answers[q.id];
                    const isThisSelected = ans.selectedLabel === opt.label;
                    
                    if (opt.is_correct) {
                        // 正確答案永遠亮綠色
                        stateClasses = "bg-green-50 border-green-500 dark:bg-green-900/30 dark:border-green-500 cursor-default shadow-sm ring-1 ring-green-500";
                    } else if (isThisSelected && !opt.is_correct) {
                        // 選錯的亮紅色
                        stateClasses = "bg-red-50 border-red-500 dark:bg-red-900/30 dark:border-red-500 cursor-default opacity-70";
                    } else {
                        // 沒選到的錯誤答案
                        stateClasses = "bg-gray-50 border-gray-200 dark:bg-gray-800/50 dark:border-gray-700 cursor-default opacity-50";
                    }
                } else {
                    btn.onclick = () => selectOption(opt.label);
                }

                btn.className = `w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between group ${stateClasses}`;
                btn.id = `opt-${opt.label}`;

                btn.innerHTML = `
                    <div class="flex items-center gap-4 flex-1">
                        <span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold font-serif-en group-hover:bg-blue-100 group-hover:text-blue-700 dark:group-hover:bg-blue-800 dark:group-hover:text-blue-200 transition-colors">${opt.label}</span>
                        <span class="text-xl font-serif-en text-gray-900 dark:text-gray-100">${opt.text}</span>
                    </div>
                    <span onclick="event.stopPropagation(); speak('${opt.text.replace(/'/g, "\\'")}')" class="speaker-btn text-2xl opacity-50 hover:opacity-100 ml-2" title="Listen">🔊</span>
                `;
                optsContainer.appendChild(btn);
            });

            // 狀態控制
            const submitBtn = document.getElementById('btn-submit');
            const expCard = document.getElementById('explanation-card');
            
            if (state.submitted) {
                submitBtn.classList.add('hidden');
                expCard.classList.remove('hidden');
                renderExplanation(q);
            } else {
                submitBtn.classList.remove('hidden');
                expCard.classList.add('hidden');
            }

            document.getElementById('quiz-scroll-area').scrollTop = 0;
            updateMistakeStar(q.id);
        }

        function formatQuestionEn(text) {
            return text.replace(/_+/g, '<span class="text-blue-600 dark:text-blue-400 font-bold border-b-[3px] border-blue-600 dark:border-blue-400 px-4 inline-block min-w-[3rem]"></span>');
        }

        function selectOption(label) {
            if (state.submitted) return;
            state.selectedOptionLabel = label;
            
            const container = document.getElementById('options-container');
            Array.from(container.children).forEach(child => {
                child.classList.remove('border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/30', 'dark:border-blue-500', 'ring-1', 'ring-blue-500');
                child.classList.add('border-gray-200', 'dark:border-gray-700', 'bg-white', 'dark:bg-gray-800');
            });
            
            const selectedBtn = document.getElementById(`opt-${label}`);
            selectedBtn.classList.remove('border-gray-200', 'dark:border-gray-700', 'bg-white', 'dark:bg-gray-800');
            selectedBtn.classList.add('border-blue-500', 'bg-blue-50', 'dark:bg-blue-900/30', 'dark:border-blue-500', 'ring-1', 'ring-blue-500');
        }

        function submitAnswer() {
            if (!state.selectedOptionLabel) {
                alert('Please select an answer first!');
                return;
            }

            const q = activeQuestions[state.currentIndex];
            const selectedOpt = q.options.find(o => o.label === state.selectedOptionLabel);
            const isCorrect = selectedOpt.is_correct;
            
            state.answers[q.id] = {
                isCorrect: isCorrect,
                selectedLabel: state.selectedOptionLabel
            };

            if (!isCorrect) {
                state.mistakes.add(q.id);
            }

            state.submitted = true;
            renderSidebar();
            renderQuestion(); 
        }

        function renderExplanation(q) {
            const ans = state.answers[q.id];
            const resultText = document.getElementById('result-text');
            const resultBanner = document.getElementById('result-banner');
            const correctOpt = q.options.find(o => o.is_correct);

            if (ans.isCorrect) {
                resultBanner.className = "p-6 flex justify-between items-center border-b border-green-200 bg-green-50 dark:bg-green-900/20 dark:border-green-900/50";
                resultText.innerHTML = `<span class="text-green-600 dark:text-green-400 flex items-center gap-2"><span class="text-2xl">✅</span> Correct! ${correctOpt.label}. ${correctOpt.text}</span>`;
            } else {
                resultBanner.className = "p-6 flex justify-between items-center border-b border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-900/50";
                resultText.innerHTML = `<span class="text-red-600 dark:text-red-400 flex items-center gap-2"><span class="text-2xl">❌</span> Incorrect. The answer is ${correctOpt.label}. ${correctOpt.text}</span>`;
            }

            const analysisContainer = document.getElementById('options-analysis-container');
            analysisContainer.innerHTML = '';

            // 渲染全選項詳解
            q.options.forEach(opt => {
                const isThisSelected = ans.selectedLabel === opt.label;
                const statusIcon = opt.is_correct ? '🟢' : (isThisSelected ? '🔴' : '⚫');
                const borderColor = opt.is_correct ? 'border-green-300 dark:border-green-700' : (isThisSelected ? 'border-red-300 dark:border-red-700' : 'border-gray-200 dark:border-gray-700');
                const bgColor = opt.is_correct ? 'bg-green-50/50 dark:bg-green-900/10' : (isThisSelected ? 'bg-red-50/50 dark:bg-red-900/10' : 'bg-gray-50 dark:bg-gray-800/50');
                
                let collHtml = opt.collocations ? `<div class="mt-2 text-sm text-gray-600 dark:text-gray-400"><span class="font-bold">🔗 搭配：</span>${opt.collocations.join(' / ')}</div>` : '';

                analysisContainer.innerHTML += `
                    <div class="p-4 rounded-xl border ${borderColor} ${bgColor} transition-colors">
                        <div class="flex flex-wrap items-baseline gap-2 mb-2">
                            <span class="text-lg font-bold text-gray-900 dark:text-white">${statusIcon} ${opt.label}. ${opt.text}</span>
                            <span class="text-gray-500 font-mono-kk text-sm">${opt.kk}</span>
                            <span class="text-gray-400 text-xs">(${opt.ipa})</span>
                            <span onclick="speak('${opt.text.replace(/'/g, "\\'")}')" class="speaker-btn ml-auto text-xl">🔊</span>
                        </div>
                        <div class="mb-3">
                            <span class="inline-block px-2 py-0.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs rounded mr-2">${opt.part_of_speech}</span>
                            <span class="text-gray-800 dark:text-gray-200 font-medium">${opt.meaning_zh}</span>
                        </div>
                        <div class="text-sm text-gray-700 dark:text-gray-300 mb-3 bg-white dark:bg-gray-800 p-2 rounded shadow-sm">
                            ${opt.fit_explanation_zh}
                        </div>
                        ${opt.phrase_example ? `
                        <div class="pl-3 border-l-2 border-blue-300 dark:border-blue-600 mt-2">
                            <p class="font-serif-en text-gray-800 dark:text-gray-200 flex gap-2">
                                ${opt.phrase_example.en}
                                <span onclick="speak('${opt.phrase_example.en.replace(/'/g, "\\'")}')" class="speaker-btn text-lg">🔊</span>
                            </p>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${opt.phrase_example.zh}</p>
                        </div>
                        ` : ''}
                        ${collHtml}
                    </div>
                `;
            });

            // 渲染額外學習區
            const extraSection = document.getElementById('extra-learning-section');
            extraSection.innerHTML = '';
            let hasExtra = false;

            if (q.ielts_tip_zh) {
                extraSection.innerHTML += `<p class="text-sm text-blue-800 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/30 p-3 rounded-lg">${q.ielts_tip_zh}</p>`;
                hasExtra = true;
            }

            if (q.related_phrasal_verbs || q.related_words) {
                const words = q.related_phrasal_verbs || q.related_words;
                const liHtml = words.map(w => `<li class="text-sm text-gray-700 dark:text-gray-300"><span class="font-serif-en font-bold">${w.phrase || w.word}</span> — ${w.meaning_zh}</li>`).join('');
                extraSection.innerHTML += `
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-3 rounded-lg">
                        <span class="font-bold text-gray-700 dark:text-gray-300 text-sm">🔁 相關片語/字彙：</span>
                        <ul class="list-disc list-inside ml-4 mt-1">${liHtml}</ul>
                    </div>
                `;
                hasExtra = true;
            }

            if(hasExtra) extraSection.classList.remove('hidden');
            else extraSection.classList.add('hidden');
        }

        function toggleMistakeStar() {
            const q = activeQuestions[state.currentIndex];
            if (state.mistakes.has(q.id)) {
                state.mistakes.delete(q.id);
            } else {
                state.mistakes.add(q.id);
            }
            updateMistakeStar(q.id);
            renderSidebar();
        }

        function updateMistakeStar(id) {
            const btn = document.getElementById('btn-star');
            if(!btn) return;
            if (state.mistakes.has(id)) {
                btn.innerHTML = '⭐';
                btn.classList.add('text-yellow-500');
            } else {
                btn.innerHTML = '☆';
                btn.classList.remove('text-yellow-500');
            }
        }

        // ================= 導覽 =================
        function nextQuestion() {
            if (state.currentIndex < activeQuestions.length - 1) {
                state.currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
            }
        }

    </script>
</body>
</html>
